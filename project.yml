name: MiraNote
options:
  bundleIdPrefix: ai.miranote
  deploymentTarget:
    iOS: "17.0"
packages:
  MiraNoteKit:
    path: MiraNoteKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    # Free Apple personal-team signing for on-device beta (Mengjia's Apple ID).
    # Keeps `xcodegen generate` from resetting the team each time.
    DEVELOPMENT_TEAM: FBY8RBCZ9M
    CODE_SIGN_STYLE: Automatic
targets:
  MiraNote:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MiraNoteKit
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Fraunces.ttf
        NSMicrophoneUsageDescription: MiraNote uses the microphone to turn your voice into notes.
        NSCameraUsageDescription: MiraNote uses the camera to add photos to your memory pages.
        NSPhotoLibraryAddUsageDescription: MiraNote saves your exported memory pages to your photo library.
        # Export compliance: the app adds no encryption of its own, it only
        # talks HTTPS. Declaring it here stops the question being asked on
        # every upload.
        ITSAppUsesNonExemptEncryption: false
        # The beta bearer token, injected from an untracked xcconfig so it
        # never reaches the repository. Absent in a build without one, which
        # the app reports as a 401 it can explain rather than refusing to run.
        BetaAPIToken: $(BETA_API_TOKEN)
        # NSAllowsLocalNetworking and NSLocalNetworkUsageDescription are gone
        # on purpose: devices reach the backends over HTTPS through the
        # Cloudflare tunnel now, not over mDNS, so the app no longer needs the
        # local-network permission and must stop asking testers for it.
        #
        # The localhost exception stays -- simulator builds still talk plain
        # HTTP to loopback.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    scheme:
      testTargets:
        - MiraNoteTests
        - MiraNoteUITests
      gatherCoverageData: false
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.miranote.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  MiraNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: MiraNote
  MiraNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: MiraNote
