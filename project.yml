name: MiraNote
options:
  bundleIdPrefix: ai.miranote
  deploymentTarget:
    iOS: "17.0"
packages:
  MiraNoteKit:
    path: MiraNoteKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    # DEVELOPMENT_TEAM deliberately lives in Config/App.xcconfig, not here.
    # Distribution is owned outside this repo, and a team pinned in a tracked
    # file is reset on every `xcodegen generate` for whoever signs the
    # TestFlight build.
    CODE_SIGN_STYLE: Automatic
targets:
  MiraNote:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MiraNoteKit
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Fraunces.ttf
        # Version and build number for TestFlight. Both read from build
        # settings so a new upload is a one-line bump of CURRENT_PROJECT_VERSION
        # (TestFlight rejects a re-used build number).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: MiraNote uses the microphone to turn your voice into notes.
        NSCameraUsageDescription: MiraNote uses the camera to add photos to your memory pages.
        NSPhotoLibraryAddUsageDescription: MiraNote saves your exported memory pages to your photo library.
        # Export compliance: the app adds no encryption of its own, it only
        # talks HTTPS. Declaring it here stops the question being asked on
        # every upload.
        ITSAppUsesNonExemptEncryption: false
        # The beta bearer token, injected from an untracked xcconfig so it
        # never reaches the repository. Absent in a build without one, which
        # the app reports as a 401 it can explain rather than refusing to run.
        BetaAPIToken: $(BETA_API_TOKEN)
        # NSAllowsLocalNetworking and NSLocalNetworkUsageDescription are gone
        # on purpose: devices reach the backends over HTTPS through the
        # Cloudflare tunnel now, not over mDNS, so the app no longer needs the
        # local-network permission and must stop asking testers for it.
        #
        # The localhost exception stays -- simulator builds still talk plain
        # HTTP to loopback.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    scheme:
      testTargets:
        - MiraNoteTests
        - MiraNoteUITests
      gatherCoverageData: false
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    preBuildScripts:
      # A build with no token compiles, passes CI and installs, then fails
      # every request once it is on a phone. Say it here instead, where
      # whoever made the build is still looking.
      - name: Check beta token
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${BETA_API_TOKEN:-}" ]; then
            echo "warning: BETA_API_TOKEN is empty -- this build cannot authenticate to the beta backends. Copy Config/Secrets.xcconfig.example to Config/Secrets.xcconfig and fill it in."
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.miranote.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        # 1.0(1) and 1.0(2) are already uploaded, so the next build is 3.
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MiraNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: MiraNote
  MiraNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: MiraNote
